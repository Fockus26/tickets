{% extends "base.html" %} {% block title %}Iniciar sesion{% endblock %} {% block
page %}login{% endblock %} {% block heading %}Iniciar Sesion{% endblock %} {%
block content %}
<section class="container login">
  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="form-group">
      <label for="username">Usuario</label>
      <input
        autocomplete="off"
        type="text"
        id="username"
        name="username"
        required
      />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        autocomplete="off"
        type="password"
        id="password"
        name="password"
        required
      />
    </div>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
